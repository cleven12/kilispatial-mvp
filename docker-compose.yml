services:
  kilispatial:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kilispatial-studio
    restart: unless-stopped
    ports:
      - "4321:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
